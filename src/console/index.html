<head>

<title>zerverg console</title>
<link rel="stylesheet" href="/console.css">
<script src="/console.js" defer></script>

<body>

<div id="topbar">
  <span id="brand">zerverg <small>console</small></span>
  <span id="userbox" hidden>

<div id="tabs" hidden>
  <a href="#/posts">Posts &amp; pages</a>

  <code>/api/v1</code> works without it.</p></noscript>
</div>

<div id="footer">
  zerverg admin console &middot; everything here goes through
